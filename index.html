<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gia Phả Họ Lê — Chi phái Gio Linh · Cam Lộ, Quảng Trị</title>
<meta name="description" content="Gia phả họ Lê — trình chiếu phả hệ từ Đời thứ Nhất đến Đời thứ Bảy, chi phái khởi nguồn tại Gio Linh, định cư Cam Lộ, Quảng Trị.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Serif+TC:wght@500;700;900&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4EBD5; --paper2:#EFE2C2; --card:#FBF6E8;
  --ink:#2B2015; --ink2:#5E4F3A; --lac:#8A1C26; --lac-d:#5E1018; --lac-dd:#2A0A0E;
  --gold:#B08D3C; --gold-l:#E0C57A; --line:#D8C596; --moss:#56604A;
  --chrome:116px;
  --serif:'Noto Serif','Times New Roman',serif; --han:'Noto Serif TC','Noto Serif',serif; --sans:'Be Vietnam Pro',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:#1b0d0f;overflow:hidden;
  background-image:radial-gradient(ellipse at 50% 0%,#3a1418 0%,#1b0d0f 60%);}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit}

/* ============ TOP BAR ============ */
.topbar{position:fixed;top:0;left:0;right:0;height:60px;z-index:40;display:flex;align-items:center;gap:14px;padding:0 18px;
  background:linear-gradient(#2a0a0e,#220a0d);border-bottom:1px solid rgba(224,197,122,.35);color:#f3e6c4}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:600;letter-spacing:.02em;white-space:nowrap}
.brand .seal{width:34px;height:34px;border:1.5px solid var(--gold-l);display:grid;place-items:center;font-family:var(--han);font-weight:900;font-size:19px;color:var(--gold-l);background:var(--lac);transform:rotate(0)}
.brand small{display:block;font-family:var(--sans);font-weight:300;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#c9b27a}
.tabs{display:flex;gap:4px;margin-left:10px}
.tab{padding:7px 14px;font-size:13px;color:#d9c79a;border:1px solid transparent;border-radius:3px;transition:.15s}
.tab:hover{color:#fff}
.tab.on{background:rgba(224,197,122,.14);border-color:rgba(224,197,122,.45);color:#fff}
.sp{flex:1}
.tb-in{background:rgba(255,255,255,.07);border:1px solid rgba(224,197,122,.3);color:#f3e6c4;border-radius:3px;padding:7px 10px;font:13px var(--sans);outline:0}
.tb-in::placeholder{color:#b9a572}
.tb-in:focus{border-color:var(--gold-l)}
select.tb-in{max-width:190px}
select.tb-in option{color:#000}
.search{position:relative}
.search input{width:210px}
.results{position:absolute;right:0;top:38px;width:340px;max-height:60vh;overflow:auto;background:var(--card);color:var(--ink);border:1px solid var(--gold);box-shadow:0 14px 40px rgba(0,0,0,.5);display:none}
.results.show{display:block}
.results button{display:block;width:100%;text-align:left;padding:9px 13px;font-size:13px;border-bottom:1px solid var(--line)}
.results button:hover{background:var(--paper2)}
.results small{display:block;color:var(--ink2);font-size:11px}
.results .none{padding:12px;font-size:13px;color:var(--ink2)}
.ibtn{width:36px;height:34px;border:1px solid rgba(224,197,122,.3);border-radius:3px;color:#e9d9a8;font-size:15px}
.ibtn:hover{background:rgba(224,197,122,.15)}

/* ============ VIEWS ============ */
#views{position:fixed;top:60px;left:0;right:0;bottom:0}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}

/* ---- deck ---- */
#deckView.on{display:flex;flex-direction:column}
.stage-wrap{flex:1;display:grid;place-items:center;padding:14px 18px 6px;min-height:0}
.stage{position:relative;width:min(100%,calc((100vh - var(--chrome)) * 16 / 9));aspect-ratio:16/9;box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 0 1px rgba(224,197,122,.45)}
.slide{position:absolute;inset:0;container-type:inline-size;opacity:0;visibility:hidden;transform:translateX(2.5%);transition:opacity .45s ease,transform .45s ease,visibility 0s .45s}
.slide.prev{transform:translateX(-2.5%)}
.slide.active{opacity:1;visibility:visible;transform:none;transition:opacity .45s ease,transform .45s ease}
.dock{height:46px;display:flex;align-items:center;gap:14px;padding:0 20px;color:#e6d6a6;font-size:13px}
.dock .nav{padding:7px 16px;border:1px solid rgba(224,197,122,.4);border-radius:3px}
.dock .nav:hover{background:rgba(224,197,122,.15)}
.bar{flex:1;height:4px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;cursor:pointer}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold-l));transition:width .35s}
.cnt{min-width:150px;text-align:center;font-family:var(--serif)}

/* ---- book (toàn văn) ---- */
#bookView{overflow:auto;background:#2a1417}
#bookView.on{display:block}
.book{max-width:1180px;margin:0 auto;padding:24px 18px 80px;display:flex;flex-direction:column;gap:22px}
.book .slide{position:relative;inset:auto;width:100%;aspect-ratio:16/9;opacity:1;visibility:visible;transform:none;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:none}

/* ---- tree ---- */
#treeView{overflow:auto;background:var(--paper);background-image:radial-gradient(circle at 20% 0%,rgba(176,141,60,.12),transparent 45%)}
.tree-head{padding:26px 34px 6px;font-family:var(--serif)}
.tree-head h2{font-size:26px;color:var(--lac-d)}
.tree-head p{color:var(--ink2);font-size:14px;margin-top:4px}
.tree-tools{padding:8px 34px 0;display:flex;gap:8px}
.tree-tools button{padding:6px 12px;border:1px solid var(--gold);color:var(--lac-d);font-size:12.5px;background:var(--card)}
.tree-tools button:hover{background:var(--lac);color:#fff}
.tr{padding:10px 34px 80px;min-width:max-content}
.tr ul{list-style:none;margin-left:22px;padding-left:22px;border-left:1.5px solid var(--gold)}
.tr>ul{margin-left:0;border:0;padding-left:0}
.tr li{position:relative;margin:7px 0}
.tr ul li::before{content:"";position:absolute;left:-22px;top:19px;width:22px;border-top:1.5px solid var(--gold)}
.tr>ul>li::before{display:none}
.tn{display:inline-flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--lac);padding:7px 12px;cursor:pointer;font-family:var(--serif);font-size:14px;transition:.15s;box-shadow:0 2px 6px rgba(43,32,21,.08)}
.tn:hover{border-color:var(--lac);transform:translateX(3px);box-shadow:0 5px 14px rgba(43,32,21,.16)}
.tn .g{font-family:var(--han);font-size:12px;color:var(--gold);border:1px solid var(--gold);padding:0 5px}
.tn .k{font-family:var(--sans);font-size:11px;color:var(--ink2)}
.tn .tg{width:18px;height:18px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font-size:11px;color:var(--lac);background:var(--paper)}
.tr li.col>ul{display:none}
.tr li.col>.tn .tg::after{content:"+"}
.tr li:not(.col)>.tn .tg::after{content:"−"}
.tr li.leaf>.tn .tg{visibility:hidden}

/* ============ SLIDE ART ============ */
.sl{position:absolute;inset:0;overflow:hidden;
  --u:1cqw;
  background:
   radial-gradient(ellipse at 12% 8%,rgba(176,141,60,.13),transparent 42%),
   radial-gradient(ellipse at 90% 95%,rgba(138,28,38,.10),transparent 46%),
   url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .34  0 0 0 0 .15  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
   var(--paper);
  color:var(--ink);font-size:calc(var(--u)*1.15)}
.sl::before{content:"";position:absolute;inset:calc(var(--u)*1);border:calc(var(--u)*.16) solid var(--gold);pointer-events:none;z-index:3}
.sl::after{content:"";position:absolute;inset:calc(var(--u)*1.6);border:calc(var(--u)*.07) solid var(--gold-l);pointer-events:none;z-index:3}
.cn{position:absolute;width:calc(var(--u)*4.2);height:calc(var(--u)*4.2);z-index:4;pointer-events:none;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40' fill='none' stroke='%23B08D3C' stroke-width='2'><path d='M3 37V8Q3 3 8 3H37'/><path d='M9 31V12Q9 9 12 9H31' stroke-width='1' /><path d='M14 14l4 4-4 4-4-4z' fill='%238A1C26' stroke='none'/></svg>") no-repeat center/contain}
.cn.tl{left:calc(var(--u)*.55);top:calc(var(--u)*.55)}
.cn.tr_{right:calc(var(--u)*.55);top:calc(var(--u)*.55);transform:scaleX(-1)}
.cn.bl{left:calc(var(--u)*.55);bottom:calc(var(--u)*.55);transform:scaleY(-1)}
.cn.br{right:calc(var(--u)*.55);bottom:calc(var(--u)*.55);transform:scale(-1)}
.foot{position:absolute;left:calc(var(--u)*5);right:calc(var(--u)*5);bottom:calc(var(--u)*2.1);display:flex;justify-content:space-between;align-items:center;font-size:calc(var(--u)*.82);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);z-index:5}
.foot b{font-family:var(--serif);font-weight:600;color:var(--lac)}
.foot .mid{flex:1;height:1px;margin:0 calc(var(--u)*1.2);background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.wm{position:absolute;font-family:var(--han);font-weight:900;color:var(--lac);opacity:.045;line-height:1;pointer-events:none;user-select:none}

/* ---- Cover ---- */
.sl.cover{background:
   radial-gradient(circle at 50% 46%,rgba(224,197,122,.16),transparent 52%),
   radial-gradient(ellipse at 50% 120%,#1a0508,transparent 60%),
   linear-gradient(160deg,#6d1520,#3d0b12 55%,#240609);color:#f5e6bd}
.sl.cover::before{border-color:var(--gold-l)} .sl.cover::after{border-color:rgba(224,197,122,.5)}
.cover .drum{position:absolute;left:50%;top:50%;width:calc(var(--u)*70);height:calc(var(--u)*70);transform:translate(-50%,-50%);opacity:.14;animation:spin 140s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.cover .vcol{position:absolute;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-family:var(--han);font-weight:700;font-size:calc(var(--u)*1.9);letter-spacing:.7em;color:var(--gold-l);opacity:.85}
.cover .vcol.l{left:calc(var(--u)*6)} .cover .vcol.r{right:calc(var(--u)*6)}
.cover .vcol::before{content:"";display:block;width:1px;height:calc(var(--u)*6);background:var(--gold);margin:0 auto calc(var(--u)*1.6)}
.cv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 calc(var(--u)*14)}
.cv .qh{font-family:var(--serif);font-size:calc(var(--u)*1.3);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.cv .kh{font-size:calc(var(--u)*1.05);font-style:italic;opacity:.85;margin-top:calc(var(--u)*.3)}
.cv .kh::after{content:"";display:block;width:calc(var(--u)*7);height:1px;background:var(--gold-l);margin:calc(var(--u)*.8) auto 0}
.cv .zp{font-family:var(--han);font-weight:900;font-size:calc(var(--u)*7.4);letter-spacing:.28em;margin:calc(var(--u)*2.4) 0 0 .28em;color:var(--gold-l);text-shadow:0 .25cqw 0 rgba(0,0,0,.35),0 0 3cqw rgba(224,197,122,.28);line-height:1.05}
.cv h1{font-family:var(--serif);font-weight:700;font-size:calc(var(--u)*4.4);letter-spacing:.07em;text-transform:uppercase;margin-top:calc(var(--u)*.8)}
.cv .sub{font-family:var(--serif);font-style:italic;font-size:calc(var(--u)*1.45);max-width:calc(var(--u)*62);margin-top:calc(var(--u)*1.2);opacity:.92;line-height:1.55}
.cv .meta{display:flex;gap:calc(var(--u)*4);margin-top:calc(var(--u)*3);padding-top:calc(var(--u)*1.8);border-top:1px solid rgba(224,197,122,.45)}
.cv .meta div{text-align:center}
.cv .meta span{display:block;font-size:calc(var(--u)*.78);letter-spacing:.16em;text-transform:uppercase;color:var(--gold-l);margin-bottom:calc(var(--u)*.3)}
.cv .meta b{font-family:var(--serif);font-weight:500;font-size:calc(var(--u)*1.25)}
.cv .hint{position:absolute;bottom:calc(var(--u)*2.8);font-size:calc(var(--u)*.85);letter-spacing:.18em;text-transform:uppercase;color:rgba(224,197,122,.7)}

/* ---- Heading block ---- */
.sh{position:absolute;left:calc(var(--u)*5);right:calc(var(--u)*5);top:calc(var(--u)*3.2)}
.sh .eb{font-size:calc(var(--u)*.88);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:500}
.sh h2{font-family:var(--serif);font-weight:600;font-size:calc(var(--u)*2.6);color:var(--lac-d);margin-top:calc(var(--u)*.3);line-height:1.2}
.sh .rule{height:calc(var(--u)*.16);margin-top:calc(var(--u)*1);background:linear-gradient(90deg,var(--lac) 0,var(--lac) calc(var(--u)*6),var(--gold) calc(var(--u)*6),transparent)}
.body{position:absolute;left:calc(var(--u)*5);right:calc(var(--u)*5);top:calc(var(--u)*9.6);bottom:calc(var(--u)*4.8);overflow:hidden}

/* ---- Origin ---- */
.origin{display:grid;grid-template-columns:1fr 1fr 1fr;gap:calc(var(--u)*2.2);height:100%;align-items:stretch}
.orb{background:var(--card);border:1px solid var(--line);border-top:calc(var(--u)*.3) solid var(--lac);padding:calc(var(--u)*2) calc(var(--u)*2.2);position:relative;box-shadow:0 .4cqw 1.2cqw rgba(43,32,21,.1)}
.orb .n{font-family:var(--han);font-weight:900;font-size:calc(var(--u)*4);color:var(--gold);opacity:.55;line-height:1}
.orb h3{font-family:var(--serif);font-size:calc(var(--u)*1.55);color:var(--lac-d);margin:calc(var(--u)*.5) 0 calc(var(--u)*.8)}
.orb p{font-size:calc(var(--u)*1.28);line-height:1.7;color:var(--ink2)}
.orb p strong{color:var(--ink)}

/* ---- Overview / phả đồ ---- */
.ov{display:flex;flex-direction:column;gap:calc(var(--u)*.9);height:100%}
.ovrow{display:flex;align-items:center;gap:calc(var(--u)*1.2)}
.ovg{flex:0 0 calc(var(--u)*8.2);text-align:center;border:1px solid var(--gold);background:var(--card);padding:calc(var(--u)*.4) 0;font-family:var(--serif);font-size:calc(var(--u)*.95);color:var(--lac-d)}
.ovg b{display:block;font-family:var(--han);font-size:calc(var(--u)*1.8);color:var(--lac);line-height:1.1}
.ovn{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.6);align-items:center;flex:1;border-bottom:1px dashed var(--line);padding-bottom:calc(var(--u)*.7)}
.ovn.last{border:0}
.pill{border:1px solid var(--line);border-left:calc(var(--u)*.28) solid var(--lac);background:var(--card);padding:calc(var(--u)*.35) calc(var(--u)*.9);font-family:var(--serif);font-size:calc(var(--u)*1.12);cursor:pointer;transition:.15s;color:var(--ink)}
.pill:hover{background:var(--lac);color:#fff;border-color:var(--lac)}
.pill.sm{font-size:calc(var(--u)*.98);border-left-color:var(--moss)}
.ovcols{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*1.2);flex:1;min-height:0}
.ovc{border:1px solid var(--line);background:rgba(251,246,232,.7);padding:calc(var(--u)*.8) calc(var(--u)*1);display:flex;flex-direction:column;gap:calc(var(--u)*.5)}
.ovc h4{font-family:var(--serif);font-size:calc(var(--u)*1.2);color:var(--lac-d);padding-bottom:calc(var(--u)*.4);border-bottom:1px solid var(--gold);cursor:pointer}
.ovc h4:hover{color:var(--lac)}
.ovc .wrapp{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.45)}
.ovc .more{font-size:calc(var(--u)*.88);color:var(--ink2);font-style:italic}
.g5{display:flex;flex-direction:column;gap:calc(var(--u)*.3);padding-bottom:calc(var(--u)*.4);border-bottom:1px dotted var(--line)}
.g5:last-child{border:0}
.g5 .pill{align-self:flex-start}
.g6{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.3);padding-left:calc(var(--u)*1.2)}
.chip{font-size:calc(var(--u)*.88);border:1px solid var(--line);background:var(--paper);padding:0 calc(var(--u)*.55);cursor:pointer;color:var(--ink2);font-family:var(--serif)}
.chip:hover{background:var(--gold);color:#fff;border-color:var(--gold)}
.ovlabel{font-size:calc(var(--u)*.82);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}

/* ---- Stats ---- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*2);height:100%;align-content:center}
.stc{background:var(--card);border:1px solid var(--line);padding:calc(var(--u)*2.6) calc(var(--u)*1.4);text-align:center;position:relative;border-bottom:calc(var(--u)*.3) solid var(--gold)}
.stc .v{font-family:var(--serif);font-weight:700;font-size:calc(var(--u)*5.6);color:var(--lac);line-height:1}
.stc .l{font-size:calc(var(--u)*1.1);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-top:calc(var(--u)*.9)}
.stc .d{font-size:calc(var(--u)*.98);color:var(--ink2);font-style:italic;margin-top:calc(var(--u)*.5)}
.stnote{grid-column:1/-1;text-align:center;font-family:var(--serif);font-style:italic;font-size:calc(var(--u)*1.3);color:var(--ink2);margin-top:calc(var(--u)*.6)}

/* ---- Generation divider ---- */
.sl.gen{background:
  radial-gradient(circle at 50% 50%,rgba(224,197,122,.14),transparent 55%),linear-gradient(150deg,#74161f,#3f0b12 60%,#260609);color:#f5e6bd}
.sl.gen::before{border-color:var(--gold-l)} .sl.gen::after{border-color:rgba(224,197,122,.5)}
.gen .g1{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 calc(var(--u)*10)}
.gen .hh{font-family:var(--han);font-weight:900;font-size:calc(var(--u)*13);color:var(--gold-l);letter-spacing:.12em;line-height:1;text-shadow:0 .4cqw 0 rgba(0,0,0,.3),0 0 4cqw rgba(224,197,122,.25)}
.gen .rn{font-family:var(--serif);font-size:calc(var(--u)*1.3);letter-spacing:.4em;text-transform:uppercase;color:var(--gold-l);margin-top:calc(var(--u)*1.4)}
.gen h2{font-family:var(--serif);font-weight:600;font-size:calc(var(--u)*3.6);margin-top:calc(var(--u)*.6)}
.gen .nt{font-family:var(--serif);font-style:italic;font-size:calc(var(--u)*1.5);opacity:.88;margin-top:calc(var(--u)*1)}
.gen .ln{width:calc(var(--u)*18);height:1px;background:linear-gradient(90deg,transparent,var(--gold-l),transparent);margin:calc(var(--u)*1.8) 0 0}
.gen .heads{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.6);justify-content:center;margin-top:calc(var(--u)*1.8);max-width:calc(var(--u)*80)}
.gen .heads span{border:1px solid rgba(224,197,122,.5);padding:calc(var(--u)*.3) calc(var(--u)*.9);font-family:var(--serif);font-size:calc(var(--u)*1.05);color:#f5e6bd;cursor:pointer}
.gen .heads span:hover{background:rgba(224,197,122,.2)}
.gen .foot{color:rgba(245,230,189,.6)} .gen .foot b{color:var(--gold-l)} .gen .foot .mid{background:linear-gradient(90deg,transparent,rgba(224,197,122,.6),transparent)}

/* ---- Person ---- */
.body>*{--u:calc(1cqw*var(--k,1))}
.pgrid{display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:calc(var(--u)*25) minmax(0,1fr);gap:calc(var(--u)*2.6);height:100%}
.tablet{position:relative;border:1px solid var(--gold);background:linear-gradient(180deg,#8f1d28,#5c1019);color:#f7e8bf;padding:calc(var(--u)*2.2) calc(var(--u)*1.8) calc(var(--u)*1.6);display:flex;flex-direction:column;box-shadow:0 .6cqw 1.8cqw rgba(60,10,15,.35);min-height:0;overflow:hidden}
.tablet::before{content:"";position:absolute;inset:calc(var(--u)*.55);border:1px solid rgba(224,197,122,.55);pointer-events:none}
.tablet .gh{position:absolute;right:calc(var(--u)*1.2);top:calc(var(--u)*.8);font-family:var(--han);font-weight:900;font-size:calc(var(--u)*5);color:var(--gold-l);opacity:.22;line-height:1}
.tablet .ey{font-size:calc(var(--u)*.88);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-l);line-height:1.5;max-width:72%;min-height:calc(var(--u)*3)}

@media (max-width:820px){

  .cv .zp{font-size:calc(var(--u)*11)} .cv h1{font-size:calc(var(--u)*6.4)}

}

/* phân loại giới tính + định dạng mục con */
function fmtItem(li,card){
  const nodes=[...li.childNodes]; let head='',tail=[]; let done=false;
  nodes.forEach(n=>{
    if(!done&&n.nodeType===3){head+=n.textContent;done=true;}
    else if(!done&&n.nodeType===1&&n.tagName==='SPAN'&&!n.className){head+=n.textContent;}
    else tail.push(n);
  });
  head=head.replace(/\s+/g,' ').trim();
  let name=head,meta='';
  const m=head.match(/^(.*?)\s+[—–]\s+(.*)$/);
  if(m){name=m[1];meta=m[2];}
  else { const m2=head.match(/^(.*?)\s*\((vô tự|vô danh)\)\s*$/i); if(m2){name=m2[1];meta='';tail.unshift(null);} }
  name=name.replace(/\s*[.,]$/,'');
  meta=meta.replace(/[.,;\s]+$/,'');
  const sex=/^Lê\s+(thị|Thị)\b/.test(name)?'f':/^Lê\s+(văn|Văn|hữu|Hữu|Quang|Phúc|Thanh|Gia|Khải|Nguyên|Khắc|Hoài|Nghĩa|Tuệ|Nhật|Anh)\b/.test(name)&&!/Lê\s+Thị/.test(name)?'m':'';
  const sx=/^Lê\s+thị/i.test(name)?'f':/^Lê\s+(văn|hữu|vô)/i.test(name)||/^Lê\s+[A-ZĐ]\p{L}+\s/u.test(name)&&!/thị/i.test(name)?'m':'';
  const kyfy=t=>esc(t).replace(/(Kỵ ngày [\d\-–\/ ]+(?:ÂL)?|Kỵ năm \d+)/g,'<b class="ky">$1</b>');
  let extra='';
  tail.forEach(n=>{ if(!n)return;
    if(n.nodeType===1&&n.tagName==='SPAN'){
      const cl=n.className==='married'?'mr':(n.className==='note'?'nt':'');
      const t=clean(n.textContent).replace(/^[—–]\s*/,'');
      if(t) extra+=`<span class="${cl||'mr'}">${esc(t)}</span>`;
    } else if(n.nodeType===3){ const t=clean(n.textContent).replace(/^[—–.\s]+/,''); if(t) extra+=`<span class="mr">${esc(t)}</span>`; }
  });
  const full=clean(li.textContent).toLowerCase();
  let target=null;
  if(/xem chi tiết|xem nhánh/.test(full)){
    target=cards.find(c=>c.gen>=6&&c!==card&&c.main&&full.includes(norm(c.main)));
  }
  return {name,meta,extra,sx,target,kyfy};
}

   </div></div>@@FOOT@@</div>`;
  const s=addSlide({title:c.main,group:'Đời '+ROM[gnum],uid:c.uid,html,card:c,
    search:[c.main,c.eyebrow,...kidsLi.map(li=>clean(li.textContent)),...c.houses.filter(h=>h.spouse).map(h=>clean(h.spouse.html.replace(/<[^>]+>/g,' ')))].join(' | ').toLowerCase()});

/* fit chữ: giảm cỡ khi nội dung tràn */
function fit(slideEl){
  if(innerWidth<=820)return;
  slideEl.querySelectorAll('.body').forEach(b=>{
    b.style.removeProperty('--k');
    const targets=[b.querySelector('.pr'),b.querySelector('.origin'),b.querySelector('.ov'),b];
    let f=1;
    const over=()=>{ const p=b.querySelector('.pr'); if(p&&p.scrollHeight>p.clientHeight+1)return true; return b.scrollHeight>b.clientHeight+1; };
    const els=[...b.querySelectorAll('.kids li,.kids .nmx,.kids .mt,.kids .mr,.kids .nt,.sp_,.kl,.hh_,.subs,.tablet,.tablet *')];
    while(over()&&f>.58){ f-=.04; b.style.setProperty('--k',f.toFixed(2)); }
    if(f>=1&&b.querySelector('.pgrid')){
      let last=1;
      while(f<1.2){ f+=.04; b.style.setProperty('--k',f.toFixed(2)); if(over()){ b.style.setProperty('--k',last.toFixed(2)); break; } last=f; }
    }
  });
}
function fitAll(){ (view==='book'?[...book.children]:[deckEls[cur]]).forEach(fit); }

function counters(el){
  el.querySelectorAll('[data-n]').forEach(v=>{ const to=+v.dataset.n; if(v._done){v.textContent=to;return;} v._done=1; const t0=performance.now();
    (function tick(t){const p=Math.min(1,(t-t0)/1100);v.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(tick);})(t0);});
}
function show(i,push){
  i=Math.max(0,Math.min(N-1,i)); const old=cur; cur=i;
  deckEls.forEach((el,k)=>{el.classList.toggle('active',k===i);el.classList.toggle('prev',k<i);});
  $('#cnt').textContent=`Trang ${i+1} / ${N} · ${slides[i].group}`;
  $('#barfill').style.width=((i+1)/N*100)+'%';
  $('#jump').value=i; $('#prev').disabled=i===0; $('#next').disabled=i===N-1;
  $('#prev').style.opacity=i===0?.4:1; $('#next').style.opacity=i===N-1?.4:1;
  if(push!==false) history.replaceState(null,'','#t'+(i+1));
  requestAnimationFrame(()=>{fit(deckEls[i]);counters(deckEls[i]);});
  if(innerWidth<=820) $('.stage-wrap').scrollTop=0;
}
function setView(v){
  view=v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===v));
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  $('#'+v+'View').classList.add('on');
  if(v==='deck'){ requestAnimationFrame(()=>{fit(deckEls[cur]);}); }
  if(v==='book'){ requestAnimationFrame(()=>{[...book.children].forEach(fit);book.querySelectorAll('[data-n]').forEach(x=>x.textContent=x.dataset.n);}); }
}

$('#jump').innerHTML=(function(){let g='',h='';slides.forEach((s,i)=>{ if(s.group!==g){ if(g)h+='</optgroup>'; g=s.group; h+=`<optgroup label="${esc(g)}">`;} h+=`<option value="${i}">${String(i+1).padStart(2,'0')} · ${esc(s.title.length>34?s.title.slice(0,32)+'…':s.title)}</option>`; }); return h+'</optgroup>';})();
$('#jump').onchange=e=>{setView('deck');show(+e.target.value);};
$('#fs').onclick=()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); else document.exitFullscreen(); };
$('#pr').onclick=()=>{ setView('book'); setTimeout(()=>print(),400); };

/* click delegation (deck + book) */
function onClick(e){
  const g=e.target.closest('[data-go],[data-gohead],[data-act]'); if(!g)return;
  if(g.dataset.go||g.dataset.gohead){ goUid(g.dataset.go||g.dataset.gohead); }
  else if(g.dataset.act==='first'){ setView('deck'); show(0); }
  else if(g.dataset.act==='print'){ setView('book'); setTimeout(()=>print(),400); }
  else if(g.dataset.act==='tree'){ setView('tree'); }
}
stage.addEventListener('click',onClick); book.addEventListener('click',onClick);

/* bàn phím + vuốt */
addEventListener('keydown',e=>{
  if(e.target.matches('input,select'))return;
  if(e.key==='/'){e.preventDefault();$('#q').focus();return;}
  if(view==='deck'){
    if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(cur+1);}
    else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(cur-1);}
    else if(e.key==='Home')show(0); else if(e.key==='End')show(N-1);
  }
  if(e.key==='f'||e.key==='F')$('#fs').click();
  if(e.key==='b'||e.key==='B')setView(view==='book'?'deck':'book');
});
let tx=null; stage.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
stage.addEventListener('touchend',e=>{ if(tx===null)return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>60){show(cur+(dx<0?1:-1));} tx=null;});
addEventListener('resize',()=>{fitAll();});

/* ---------- 4. tìm kiếm ---------- */
const q=$('#q'), res=$('#res');
q.addEventListener('input',()=>{
  const t=q.value.trim().toLowerCase(); if(t.length<2){res.classList.remove('show');return;}
  const hits=slides.filter(s=>s.search&&s.search.includes(t)).slice(0,30);
  res.innerHTML=hits.length?hits.map(s=>{
    const k=s.search.indexOf(t); const ctx=s.search.slice(Math.max(0,k-30),k+60);
    return `<button data-s="${s.i}">${esc(s.title)}<small>${esc(s.group)}${s.title.toLowerCase().includes(t)?'':' · …'+esc(ctx)+'…'}</small></button>`;}).join(''):'<div class="none">Không tìm thấy kết quả.</div>';
  res.classList.add('show');
});
res.onclick=e=>{const b=e.target.closest('[data-s]'); if(!b)return; setView('deck'); show(+b.dataset.s); res.classList.remove('show'); q.value='';};
document.addEventListener('click',e=>{ if(!e.target.closest('.search'))res.classList.remove('show'); });
q.addEventListener('keydown',e=>{ if(e.key==='Escape'){res.classList.remove('show');q.blur();} if(e.key==='Enter'){const b=res.querySelector('[data-s]'); if(b)b.click();} });

/* ---------- 5. phả đồ (cây) ---------- */
function treeNode(c){
  const hasKids=c.children.length+c.kids.filter(k=>!c.children.includes(k)).length;
  const kids=c.children.length?c.children:c.kids;
  const startCol=c.gen>=4&&kids.length>0&&c.gen!==4;
  return `<li class="${kids.length?(c.gen>=5?'col':''):'leaf'}"><span class="tn" data-uid="${c.uid}"><span class="tg"></span><span class="g">${ROM[Math.min(c.gen,7)]}</span>${esc(c.main)}<span class="k">${c.houses.reduce((a,h)=>a+h.items.length,0)} con</span></span>${kids.length?`<ul>${kids.map(treeNode).join('')}</ul>`:''}</li>`;
}
/* gắn level-2 vào children để cây đủ */
cards.forEach(c=>{ if(c.gen===7){} });
cards.filter(c=>c.parent&&c.gen>=7&&!c.parent.children.includes(c)).forEach(c=>c.parent.children.push(c));
$('#tr').innerHTML='<ul>'+treeNode(gen1)+'</ul>';
$('#tr').addEventListener('click',e=>{
  const tg=e.target.closest('.tg'); const tn=e.target.closest('.tn'); if(!tn)return;
  if(tg){ tn.parentElement.classList.toggle('col'); return; }
  setView('deck'); show(cardSlide[tn.dataset.uid].i);
});
$('#expAll').onclick=()=>document.querySelectorAll('.tr li').forEach(l=>l.classList.remove('col'));
$('#colAll').onclick=()=>document.querySelectorAll('.tr li').forEach(l=>{ if(l.querySelector(':scope>ul')&&l.querySelector('.tn .g')&&l.querySelector('.tn .g').textContent!=='I'&&l.querySelector('.tn .g').textContent!=='II'&&l.querySelector('.tn .g').textContent!=='III')l.classList.add('col'); });

/* ---------- khởi động ---------- */
const m=location.hash.match(/#t(\d+)/);
show(m?+m[1]-1:0,false);
setTimeout(()=>{fit(deckEls[cur]);},300);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{fitAll();if(view==='book')[...book.children].forEach(fit);});
})();
</script>
</body>
